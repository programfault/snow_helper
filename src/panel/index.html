<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SRE Helper Panel</title>
    <link rel="stylesheet" href="./panel.css" />
  </head>
  <body>
    <div id="root" class="panel-root">
      <header class="panel-titlebar">
        <div class="panel-titlebar-actions">
          <button id="btn-settings" class="panel-icon-button" title="Open settings" type="button">⚙</button>
          <button id="btn-picker" class="panel-primary-button" type="button">+ Field</button>
        </div>
      </header>
      <main class="panel-body">
        <section class="panel-section" id="section-groups">
          <div class="panel-section-head">
            <h2 class="panel-section-title">Field Groups</h2>
            <div class="panel-section-head-actions">
              <button id="btn-collapse-all" class="panel-ghost-button" type="button" title="Collapse all groups">Collapse All</button>
              <button id="btn-groups-settings" class="panel-ghost-button" type="button">Manage Groups</button>
            </div>
          </div>
          <p id="groups-empty" class="panel-empty">No groups yet. Click <strong>Manage Groups</strong> to create one.</p>
          <div id="groups-root" class="panel-groups" aria-label="Field groups"></div>
        </section>

        <!-- Information: site-specific details (e.g. globe.com.ph tokens, WO/SID).
             This section was previously called "Token Status" — renamed and
             expanded to hold any per-site information, including the access
             token and work order identifiers used by SRE workflows. -->
        <section class="panel-section">
          <h2 class="panel-section-title">Information</h2>
          <ul id="info-list" class="panel-info-list" aria-label="Site information"></ul>
        </section>

        <section class="panel-section">
          <h2 class="panel-section-title">Services</h2>
          <p id="services-empty" class="panel-empty">No services yet. Define them in Settings.</p>
          <ul id="services-list" class="panel-list" aria-label="Remote services"></ul>
        </section>
      </main>

      <footer id="toast-area" class="panel-toast-area" aria-live="polite"></footer>
    </div>

    <script type="module" src="./panel.ts"></script>
  </body>
</html>
