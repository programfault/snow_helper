<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SRE Helper Panel</title>
    <link rel="stylesheet" href="./panel.css" />
  </head>
  <body>
    <div id="root" class="panel-root">
      <header class="panel-titlebar">
        <div class="panel-titlebar-actions">
          <button id="btn-settings" class="panel-icon-button" title="Open SRE Helper settings" type="button">⚙</button>
        </div>
      </header>
      <main class="panel-body">
        <!-- Playbooks: multi-step workflow runner (new core UX). -->
        <section class="panel-section" id="section-playbooks">
          <div class="panel-section-head">
            <h2 class="panel-section-title">Playbooks</h2>
            <div class="panel-section-head-actions">
              <button id="btn-manage-playbooks" class="panel-ghost-button" type="button" title="Create, import, or edit playbook YAMLs">Manage Playbooks</button>
              <button id="btn-refresh-form-context" class="panel-ghost-button" type="button" title="Refresh SN form context (table/sysId/state)">Refresh Context</button>
            </div>
          </div>
          <p id="playbooks-empty" class="panel-empty">No playbooks yet. Click <strong>Manage Playbooks</strong> above to create or import a YAML. Two built-in examples (Reassign / Close) should appear once the storage is seeded.</p>
          <div id="playbooks-root" class="panel-playbooks" aria-label="Multi-step workflow playbooks"></div>
        </section>

        <!-- Information: per-site information (globe.com.ph tokens, WO ids, SIDs, ...) -->
        <section class="panel-section">
          <h2 class="panel-section-title">Information</h2>
          <ul id="info-list" class="panel-info-list" aria-label="Site information"></ul>
        </section>
      </main>

      <footer id="toast-area" class="panel-toast-area" aria-live="polite"></footer>
    </div>

    <!-- Modal overlay: reused for playbook inputs prompt, playbook editor, etc. -->
    <div id="modal-root" class="panel-modal-root" hidden aria-hidden="true" role="dialog" aria-modal="true">
      <div class="panel-modal-backdrop" data-modal-close></div>
      <div class="panel-modal-dialog" role="document">
        <header class="panel-modal-header">
          <h3 id="modal-title" class="panel-modal-title"></h3>
          <button class="panel-icon-button panel-modal-close" type="button" aria-label="Close" data-modal-close>✕</button>
        </header>
        <div id="modal-body" class="panel-modal-body"></div>
        <footer id="modal-footer" class="panel-modal-footer"></footer>
      </div>
    </div>

    <script type="module" src="./panel.ts"></script>
  </body>
</html>
